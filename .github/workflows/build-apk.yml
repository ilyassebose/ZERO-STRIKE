name: Build ZERO STRIKE APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Init Capacitor
        run: npx cap init "ZERO STRIKE" "com.ilyasse.zerostrike" --web-dir www || true

      - name: Add Android platform
        run: npx cap add android || true

      - name: Copy native Kotlin files
        run: |
          mkdir -p android/app/src/main/java/com/ilyasse/zerostrike
          cp -r android-native/com/ilyasse/zerostrike/* android/app/src/main/java/com/ilyasse/zerostrike/

      - name: Add Filament dependencies
        run: |
          G=android/app/build.gradle
          if ! grep -q "filament-android" "$G"; then
            sed -i '/dependencies {/a\    implementation "com.google.android.filament:filament-android:1.51.0"\n    implementation "com.google.android.filament:gltfio-android:1.51.0"\n    implementation "com.google.android.filament:filament-utils-android:1.51.0"' "$G"
          fi
          # Ajouter le support des manettes dans le manifest
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "gamepad" "$M"; then
            sed -i 's|</application>|    <uses-feature android:name="android.hardware.gamepad" android:required="false" />\n    </application>|' "$M"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission
        run: chmod +x android/gradlew

      - name: Build APK
        run: cd android && ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZERO-STRIKE-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
