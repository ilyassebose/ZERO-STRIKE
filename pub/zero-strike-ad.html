<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>ZERO STRIKE — Pub 10s</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100vw; height: 100vh;
    background: #000;
    overflow: hidden;
    font-family: 'Orbitron', 'Arial Black', sans-serif;
  }

  /* Scène principale */
  #scene {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0a0a1a 0%, #000 100%);
  }

  /* Grille néon en fond */
  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(0, 240, 255, 0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.15) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: perspective(500px) rotateX(60deg) scale(2);
    transform-origin: center bottom;
    opacity: 0;
    animation: gridAppear 1s ease-out 0.3s forwards;
  }

  @keyframes gridAppear {
    to { opacity: 0.6; }
  }

  /* Logo ZERO STRIKE */
  #logo {
    position: relative;
    z-index: 10;
    font-size: 11vw;
    font-weight: 900;
    letter-spacing: 12px;
    color: #fff;
    text-shadow:
      0 0 20px #00f0ff,
      0 0 40px #00f0ff,
      0 0 80px #00f0ff,
      0 0 120px rgba(0, 240, 255, 0.5);
    opacity: 0;
    transform: scale(0.6);
    animation: logoAppear 1s cubic-bezier(0.4, 0, 0.2, 1) 0s forwards;
  }

  @keyframes logoAppear {
    to { opacity: 1; transform: scale(1); }
  }

  /* Pulse du logo */
  #logo.pulse {
    animation: logoPulse 1.5s ease-in-out infinite;
  }

  @keyframes logoPulse {
    0%, 100% {
      text-shadow:
        0 0 20px #00f0ff,
        0 0 40px #00f0ff,
        0 0 80px #00f0ff;
    }
    50% {
      text-shadow:
        0 0 30px #00f0ff,
        0 0 60px #00f0ff,
        0 0 120px #00f0ff,
        0 0 200px #00f0ff;
    }
  }

  /* Sous-titre */
  #subtitle {
    position: absolute;
    bottom: 25%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2vw;
    color: #00f0ff;
    letter-spacing: 8px;
    opacity: 0;
    animation: subAppear 0.8s ease-out 1.5s forwards;
  }

  @keyframes subAppear {
    to { opacity: 1; }
  }

  /* Badge "Android" */
  #android {
    position: absolute;
    bottom: 15%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.5vw;
    color: #fff;
    letter-spacing: 4px;
    opacity: 0;
    animation: subAppear 0.8s ease-out 2s forwards;
  }

  /* Kill feed animé (simulé) */
  .killfeed {
    position: fixed;
    top: 15%;
    right: 5%;
    z-index: 20;
    opacity: 0;
    animation: kfAppear 0.5s ease-out forwards;
  }

  .killfeed-item {
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(20px);
    border: 1px solid #00f0ff;
    border-radius: 12px;
    padding: 12px 20px;
    margin-bottom: 10px;
    color: #fff;
    font-size: 1.2vw;
    font-weight: 700;
    letter-spacing: 2px;
    box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .killfeed-item.headshot {
    border-color: #ff006e;
    box-shadow: 0 0 25px rgba(255, 0, 110, 0.6);
  }

  .killfeed-item .xp {
    margin-left: 20px;
    color: #00f0ff;
    font-weight: 900;
  }

  .killfeed-item.headshot .xp {
    color: #ff006e;
  }

  @keyframes kfAppear {
    from { opacity: 0; transform: translateX(400px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* Séquence flash */
  #flash {
    position: fixed;
    inset: 0;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    z-index: 999;
  }

  /* Final : fade noir */
  #final {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    z-index: 1000;
    transition: opacity 1s;
  }

  /* Logo final + PEGI */
  #finalContent {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    opacity: 0;
    z-index: 1001;
    pointer-events: none;
  }

  #finalContent .small-logo {
    font-size: 6vw;
    font-weight: 900;
    letter-spacing: 10px;
    color: #fff;
    text-shadow: 0 0 30px #00f0ff, 0 0 60px #00f0ff;
  }

  #finalContent .info {
    font-size: 1.8vw;
    color: #00f0ff;
    letter-spacing: 6px;
    text-align: center;
    line-height: 2;
  }

  #finalContent .pegi {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 80px;
    height: 80px;
    border: 4px solid #fff;
    background: #fff;
    color: #000;
    font-size: 32px;
    font-weight: 900;
    border-radius: 8px;
    margin-top: 20px;
  }

  #finalContent .pegi-label {
    font-size: 0.9vw;
    color: #fff;
    letter-spacing: 4px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<!-- Grille de fond -->
<div id="grid"></div>

<!-- Kill feed simulé -->
<div class="killfeed" id="kf1">
  <div class="killfeed-item headshot">
    <span style="font-size: 1.8vw;">🎯</span>
    <span>HEADSHOT — BOT_Kevin</span>
    <span class="xp">+15 XP</span>
  </div>
</div>

<div class="killfeed" id="kf2" style="top: 25%;">
  <div class="killfeed-item">
    <span style="font-size: 1.8vw;">💀</span>
    <span>KILL — BOT_Max</span>
    <span class="xp">+10 XP</span>
  </div>
</div>

<div class="killfeed" id="kf3" style="top: 35%;">
  <div class="killfeed-item headshot">
    <span style="font-size: 1.8vw;">🎯</span>
    <span>DOUBLE KILL — BOT_Steve</span>
    <span class="xp">+25 XP</span>
  </div>
</div>

<!-- Flash -->
<div id="flash"></div>

<!-- Logo principal -->
<div id="scene">
  <div id="logo">ZERO STRIKE</div>
</div>

<div id="subtitle">FPS 3D MULTIJOUEUR</div>
<div id="android">DISPONIBLE SUR ANDROID</div>

<!-- Écran final -->
<div id="final"></div>
<div id="finalContent">
  <div class="small-logo">ZERO STRIKE</div>
  <div class="info">
    Disponible sur Android
  </div>
  <div class="pegi">16</div>
  <div class="pegi-label">PEGI 16</div>
</div>

<script>
// Timeline de la pub (10 secondes)
const timeline = [
  // t=0s : logo apparaît
  { t: 0,    fn: () => { document.getElementById('logo').classList.add('pulse'); } },

  // t=2s : flash subtil
  { t: 2000, fn: () => {
      const f = document.getElementById('flash');
      f.style.transition = 'opacity 0.15s';
      f.style.opacity = '0.4';
      setTimeout(() => f.style.opacity = '0', 150);
  }},

  // t=3s : premier kill feed
  { t: 3000, fn: () => {
      document.getElementById('kf1').style.opacity = '1';
      document.getElementById('kf1').style.animation = 'kfAppear 0.5s ease-out';
  }},

  // t=4.5s : deuxième kill feed
  { t: 4500, fn: () => {
      document.getElementById('kf2').style.opacity = '1';
      document.getElementById('kf2').style.animation = 'kfAppear 0.5s ease-out';
  }},

  // t=6s : troisième kill feed + flash
  { t: 6000, fn: () => {
      document.getElementById('kf3').style.opacity = '1';
      document.getElementById('kf3').style.animation = 'kfAppear 0.5s ease-out';
      const f = document.getElementById('flash');
      f.style.opacity = '0.5';
      setTimeout(() => f.style.opacity = '0', 100);
  }},

  // t=7s : fade vers noir
  { t: 7000, fn: () => {
      document.getElementById('final').style.opacity = '1';
  }},

  // t=7.5s : logo final apparaît
  { t: 7500, fn: () => {
      document.getElementById('finalContent').style.transition = 'opacity 0.8s';
      document.getElementById('finalContent').style.opacity = '1';
  }},

  // t=10s : fin (la pub reste sur le final)
  { t: 10000, fn: () => {
      console.log('[PUB] Terminée');
  }}
];

// Lancer la timeline
timeline.forEach(step => setTimeout(step.fn, step.t));

// Redémarrer automatiquement après 12s (loop pour test)
setTimeout(() => location.reload(), 12000);
</script>

</body>
</html>
